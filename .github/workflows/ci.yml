name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run type-check

  build:
    runs-on: ubuntu-latest
    needs: type-check
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bunx vite build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bunx vitest run

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run lint

  bun-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      # Sharded: one bun process per test dir keeps each invocation under
      # the hosted runner's memory ceiling (a single 767-file run OOMs the
      # runner ~5min in). --smol + --timeout=30s absorbs sim-heavy specs
      # that exceed bun's 5s default on a starved 4-core runner.
      - name: Run bun test suite (sharded)
        run: |
          set -e
          for d in src/test/engine/*/ src/test/components src/test/config src/test/data src/test/hooks src/test/integration src/test/lib src/test/megaplan src/test/pages src/test/routes src/test/schemas src/test/scripts src/test/state src/test/ui src/test/utils; do
            echo "=== bun shard: $d"
            bun --smol test --isolate --timeout 30000 "$d"
          done
          shopt -s nullglob
          root_files=(src/test/*.test.ts src/test/*.test.tsx)
          [ ${#root_files[@]} -gt 0 ] && bun --smol test --isolate --timeout 30000 "${root_files[@]}"

  slow-tests:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bunx vitest run --config vitest.config.slow.ts

  coverage:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      # Thresholds in vitest.config.ts fail the job on coverage regression.
      - run: bunx vitest run --coverage --reporter=dot

  electron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run electron:compile

  e2e:
    runs-on: ubuntu-latest
    needs: test
    # seasonal-tournament spec self-sets 25min; the living world roughly
    # doubles bout volume, so 15min is no longer sufficient headroom.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test --project=chromium
