name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run type-check

  build:
    runs-on: ubuntu-latest
    needs: type-check
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bunx vite build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bunx vitest run

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run lint

  bun-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      # Sharded: one bun process per test dir keeps each invocation under
      # the hosted runner's memory ceiling (a single 767-file run OOMs the
      # runner ~5min in). --smol + --timeout=30s absorbs sim-heavy specs
      # that exceed bun's 5s default on a starved 4-core runner.
      - name: Run bun test suite (sharded)
        run: |
          set -e
          # Enumerate dirs dynamically — a hardcoded list drifted before (70
          # non-slow files silently unsharded: engine-root specs, constants/,
          # layout/, lore/, vite/, _setup/, _fixtures/). Engine is ~55% of the
          # suite — keep its per-subdir split + a root-files shard for memory.
          shopt -s nullglob
          for d in $(find src/test -mindepth 1 -maxdepth 1 -type d | sort); do
            if [ "$d" = "src/test/engine" ]; then
              for sub in $(find "$d" -mindepth 1 -maxdepth 1 -type d | sort); do
                find "$sub" -name '*.test.ts' -o -name '*.test.tsx' | grep -v '\.slow\.test\.' | grep -qv . || continue
                echo "=== bun shard: $sub"
                bun --smol test --isolate --timeout 30000 "$sub"
              done
              engine_root=(src/test/engine/*.test.ts src/test/engine/*.test.tsx)
              [ ${#engine_root[@]} -gt 0 ] && bun --smol test --isolate --timeout 30000 "${engine_root[@]}"
            else
              # Skip dirs whose only tests are .slow/bun-ignored — a
              # zero-match filter makes bun exit 1.
              find "$d" -name '*.test.ts' -o -name '*.test.tsx' | grep -v '\.slow\.test\.' | grep -qv . || continue
              echo "=== bun shard: $d"
              bun --smol test --isolate --timeout 30000 "$d"
            fi
          done
          root_files=(src/test/*.test.ts src/test/*.test.tsx)
          [ ${#root_files[@]} -gt 0 ] && bun --smol test --isolate --timeout 30000 "${root_files[@]}"

  # The *.slow.test.ts suite moved to .github/workflows/nightly.yml
  # (nightly + workflow_dispatch) — it is intentionally not a per-PR gate.
  coverage:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      # Thresholds in vitest.config.ts fail the job on coverage regression.
      - run: bunx vitest run --coverage --reporter=dot

  electron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run electron:compile

  e2e:
    runs-on: ubuntu-latest
    needs: test
    # Fast tier only: chromium smoke, @slow marathon specs excluded. The full
    # browser matrix + @slow specs run in the nightly workflow / on dispatch.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test --project=chromium --grep-invert '@slow'
