# Pin the public npm registry so `bun install` produces a portable bun.lock
# regardless of a developer's global ~/.npmrc (e.g. corporate artifactory mirrors).
[install]
registry = "https://registry.npmjs.org"

[test]
# bunViPolyfill MUST precede bun-setup: setup.ts calls vi.unmock at top level,
# and ESM hoisting means bun-setup cannot shim it before its own ./setup import.
preload = ["./src/test/_setup/bunViPolyfill.ts", "./src/test/_setup/bun-setup.ts"]
# .slow tests are excluded for parity with the default `bunx vitest run` suite;
# they retain dedicated CI coverage via the `slow-tests` job.
# out/** is gitignored electron-packager output — it contains a full bundled
# copy of src/test plus dependency test files that must never be collected.
# bibleIndex.test.ts and HelpA11y.test.tsx transitively import src/lib/bibleIndex.ts,
# which relies on Vite's `import.meta.glob` transform (?raw/eager) and cannot run
# under Bun's test runner. The megaplan wired-guard specs call `import.meta.glob`
# directly for the same compile-before-implementation pattern. All remain covered
# by the vitest suite. entityLink.perf mounts a real zustand store behind a
# vi.mock async factory + React Profiler/act — vitest-only, hangs bun's runner.
pathIgnorePatterns = ["e2e/**", "out/**", "src/test/config/environmentNodeCanary.test.ts", "src/test/config/electronMain.test.ts", "**/*.slow.test.ts", "src/test/lib/bibleIndex.test.ts", "src/test/pages/HelpA11y.test.tsx", "src/test/megaplan/appShell.cta.test.tsx", "src/test/megaplan/styleArchives.wired.test.tsx", "src/test/megaplan/wiring.wired.test.tsx", "src/test/components/entityLink.perf.test.tsx"]
